<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>COSMOS 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loading">
    <div class="loader-logo">COSMOS</div>
    <div class="loader-bar">
        <div></div>
    </div>
    <p>Ładowanie kosmosu...</p>
</div>

<div id="app">

    <header>
        <div class="logo">
            COSMOS<span>3D</span>
        </div>

        <div class="status">
            ● SYSTEM ONLINE
        </div>
    </header>

    <div class="info">
        <div class="small">UKŁAD SŁONECZNY</div>
        <h1 id="planetName">KOSMOS</h1>
        <p id="planetInfo">
            Przeciągnij ekran, aby obracać widok.
            Przybliżaj dwoma palcami.
        </p>
    </div>

    <div id="planetCard">

        <button id="close">×</button>

        <div class="card-label">
            OBIEKT
        </div>

        <h2 id="cardName">
            ZIEMIA
        </h2>

        <p id="cardDescription">
            Nasza planeta.
        </p>

        <div class="stats">

            <div>
                <span>ŚREDNICA</span>
                <b id="diameter">12 742 km</b>
            </div>

            <div>
                <span>ROK</span>
                <b id="year">365 dni</b>
            </div>

        </div>

        <button id="focus">
            OBEJRZYJ PLANETĘ
        </button>

    </div>

    <div class="bottom">
        <span>3D SPACE EXPLORER</span>
        <span id="coordinates">X 000 Y 000 Z 000</span>
    </div>

    <canvas id="space"></canvas>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>

</body>
</html>
